# Builds the wall panel's firmware and puts the image back in the repository.
#
# The image is in the repository so that a person presses Flash on the panel
# page and the board is written, with nothing to fetch and nothing to put
# anywhere. An update brings the image with every other file.
#
# Build output in a repository goes out of date, so nothing here leaves that
# to somebody remembering. This job is the only writer of prebuilt/, it runs
# on every change under firmware/companion, and it writes the fingerprint of
# the source it built from beside the image. The page compares the two and
# refuses an image that does not match. See companion.firmware_fingerprint.
#
# The container is Espressif's own, at the version dependencies.lock names.
# Nothing is installed on anybody's machine, here or on a Steam Machine.

name: Wall panel firmware

on:
  push:
    paths:
      - 'firmware/companion/**'
      - '!firmware/companion/prebuilt/**'
      - '.github/workflows/companion-firmware.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  # One build for each branch. A second push while this runs replaces it:
  # the image of the older commit is not one anybody wants.
  group: companion-firmware-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    container: espressif/idf:v5.5.5

    steps:
      - name: Check out this branch
        uses: actions/checkout@v4

      - name: Let git read a checkout that another user made
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Build the firmware
        shell: bash
        run: |
          set -euo pipefail
          . "$IDF_PATH/export.sh"
          cd firmware/companion
          idf.py set-target esp32s3
          idf.py build

      - name: Record what the board support does with the backlight
        # The components are downloaded by the build and are in no
        # repository, so nothing outside a build can read them. The backlight
        # of this board has cost rounds of guessing already, so the build
        # prints what the board support really does with it. It reads files,
        # it changes nothing, and it puts the answer in the log where the
        # next person who needs it will look.
        #
        # The timer is the part that decides. The brightness function writes
        # a duty of up to 1023, and 1023 means "nearly always on" at ten bits
        # and "one eighth on" at thirteen. The first is a backlight that will
        # not go off; the second is a backlight at most of its brightness.
        shell: bash
        run: |
          set -uo pipefail
          bsp=firmware/companion/managed_components/waveshare__esp32_s3_touch_lcd_4b
          echo "===== the backlight timer and channel ====="
          sed -n '/LCD_backlight_channel = {/,/^}/p;/LCD_backlight_timer = {/,/^}/p' \
            "$bsp"/esp32_s3_touch_lcd_4b.c 2>/dev/null || true
          echo "===== the brightness function ====="
          sed -n '/^esp_err_t bsp_display_brightness_set/,/^}/p' \
            "$bsp"/esp32_s3_touch_lcd_4b.c 2>/dev/null || true
          echo "===== the names it uses ====="
          grep -rnE '#define +(LCD_LEDC_CH|BSP_LCD_BACKLIGHT|LCD_BACKLIGHT|BSP_LCD_BL)' \
            "$bsp" 2>/dev/null || echo "(no such define)"
          echo "===== every LEDC call in the board support ====="
          grep -rn 'ledc_' "$bsp" --include='*.c' 2>/dev/null || true
          echo "===== what else can reach the panel: rails and expander ====="
          # Holding the backlight pin high did not stop the swinging, so
          # something other than LEDC reaches those LEDs. These are the two
          # candidates on this board: the power chip that feeds the rails,
          # and the expander that carries the reset and enable lines.
          grep -rnE 'axp|AXP|power_init|dcdc|DCDC|aldo|ALDO|bldo|BLDO' \
            "$bsp" --include='*.c' --include='*.h' 2>/dev/null | head -40 \
            || echo "(nothing matched)"
          echo "===== expander pins the board support names ====="
          grep -rnE 'IO_EXPANDER_PIN_NUM|EXIO|tca95|TCA95' \
            "$bsp" --include='*.c' --include='*.h' 2>/dev/null | head -40 \
            || echo "(nothing matched)"
          echo "===== every pin the board support defines ====="
          grep -rnE '#define +BSP_[A-Z0-9_]+ +\(?GPIO_NUM' \
            "$bsp" --include='*.h' 2>/dev/null || true

      - name: Record how the panel gets its frame buffers
        # Reported from the board: small tears run through the startup
        # animation. Fewer frames did not help, so it is not the rate; it is
        # one draw buffer of 48 rows copied into a frame buffer while the
        # display scans that same buffer out.
        #
        # The answer to that is two frame buffers and a swap on the vertical
        # blank, which esp_lvgl_port calls avoid_tearing. Whether this board
        # can do it is not ours to decide: bsp_display_new creates the RGB
        # panel, and the number of frame buffers is set there.
        #
        # So this prints what the board support really does, the way the
        # backlight step above does. It reads files and changes nothing.
        shell: bash
        run: |
          set -uo pipefail
          bsp=firmware/companion/managed_components/waveshare__esp32_s3_touch_lcd_4b
          port=firmware/companion/managed_components/espressif__esp_lvgl_port
          echo "===== how the board support makes the RGB panel ====="
          sed -n '/esp_lcd_rgb_panel_config_t/,/};/p' \
            "$bsp"/esp32_s3_touch_lcd_4b.c 2>/dev/null || true
          echo "===== what a caller can pass to bsp_display_new ====="
          sed -n '/typedef struct.*{/,/} *bsp_display_config_t;/p' \
            "$bsp"/include/bsp/esp32_s3_touch_lcd_4b.h 2>/dev/null || true
          echo "===== every buffer and tearing option the board offers ====="
          grep -rnE 'BUFFER_NUMS|NUM_FB|num_fbs|bounce_buffer|BOUNCE|double_fb|no_fb' \
            "$bsp" --include='*.c' --include='*.h' --include='Kconfig*' \
            2>/dev/null | head -40 || echo "(nothing matched)"
          echo "===== what esp_lvgl_port does with avoid_tearing ====="
          grep -rn 'avoid_tearing' "$port" --include='*.c' --include='*.h' \
            2>/dev/null | head -30 || echo "(nothing matched)"
          echo "===== and whether it allows it beside a bounce buffer ====="
          sed -n '/avoid_tearing/,/^    }/p' "$port"/src/lvgl9/esp_lvgl_port_disp.c \
            2>/dev/null | head -60 || true

      - name: Build and run the checks that need LVGL
        # firmware/companion/preview holds the checks of the screen half,
        # and nothing ran them. They link against LVGL, which the build above
        # already downloaded, so here they cost nothing to build.
        #
        # They were unbuildable when this step was written: ui.c had grown a
        # call into panel_text.c and another into panel_ui_sleep.c, and
        # neither was in the CMakeLists. Nothing noticed, because nothing
        # built them. The first run of check_navigation then failed, because
        # it clicked on the German words of a panel that answers in English.
        #
        # firmware/companion/preview/CMakeLists.txt says how to run these on
        # your own machine, which takes one clone and no Espressif tools.
        shell: bash
        run: |
          set -euo pipefail
          . "$IDF_PATH/export.sh"
          cmake -S firmware/companion/preview -B preview-build \
                -DCMAKE_BUILD_TYPE=Debug
          cmake --build preview-build --target check_power check_idle \
                check_navigation check_boot check_wol panel_preview -j"$(nproc)"
          ./preview-build/check_power
          # check_wol needs no LVGL. It is here because this is where the
          # checks of the firmware run.
          ./preview-build/check_wol
          ./preview-build/check_idle
          ./preview-build/check_navigation
          # check_boot plays the real animation, so it takes the clip's own
          # three seconds and a little more.
          ./preview-build/check_boot
          # panel_preview draws the screen into a file. It answers nothing,
          # and building and running it is the point: it went stale twice
          # while nothing built it. tests/test_preview_checks.py holds that
          # every target under preview/ is named on the line above.
          ./preview-build/panel_preview "$RUNNER_TEMP/panel.ppm"
          ls -l "$RUNNER_TEMP/panel.ppm"

      - name: Put the image where the panel looks for it
        shell: bash
        run: |
          set -euo pipefail
          build=firmware/companion/build
          out=firmware/companion/prebuilt
          mkdir -p "$out/bootloader" "$out/partition_table"
          cp "$build/bootloader/bootloader.bin"               "$out/bootloader/"
          cp "$build/partition_table/partition-table.bin"     "$out/partition_table/"
          cp "$build/steamos_companion.bin"                   "$out/"
          # The fingerprint of the source this was built from. The page reads
          # it and refuses an image that does not match the firmware beside
          # it. One function answers here and there.
          PYTHONDONTWRITEBYTECODE=1 PYTHONPATH=server python3 -c \
            'from steamos_utility_center import companion; print(companion.firmware_fingerprint("."))' \
            > "$out/built-from"
          ( cd "$out" && sha256sum bootloader/bootloader.bin \
              partition_table/partition-table.bin steamos_companion.bin \
              > SHA256SUMS )
          ls -l "$out"

      - name: Commit it, if it changed
        shell: bash
        run: |
          set -euo pipefail
          git add firmware/companion/prebuilt
          if git diff --cached --quiet; then
            echo "the image is the same as the one already here"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit \
            -m "Build the wall panel firmware for ${GITHUB_SHA:0:7}" \
            -m "The image that the Flash button on the panel page writes, built from the firmware in this commit. built-from holds the fingerprint of that source, and the page refuses an image whose fingerprint does not match." \
            -m "Written by .github/workflows/companion-firmware.yml. A push made with GITHUB_TOKEN starts no further run, so this commit does not build again."
          git push origin "HEAD:${GITHUB_REF_NAME}"
