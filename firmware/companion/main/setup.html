<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Set up the SteamOS panel</title>
<style>
body{background:#101827;color:#f2f5fa;font:16px system-ui;margin:0;padding:24px;box-sizing:border-box}main{max-width:460px;margin:auto}h1{color:#59d8b5;font-size:25px}label{display:block;margin:20px 0 7px}input,button{font:inherit;box-sizing:border-box;width:100%;padding:14px;border:1px solid #405269;border-radius:10px;color:inherit;background:#202d40}button{margin-top:24px;background:#59d8b5;color:#101827;font-weight:600}p{line-height:1.5}small{color:#b9c7d7}#result{white-space:pre-wrap}
</style>
<main><h1>Set up the SteamOS panel</h1><p>Put the panel on your own network and point it at your SteamOS PC.</p>
<form id="setup"><label for="ssid">Network name (2.4 GHz)</label><input id="ssid" name="ssid" required maxlength="32" autocomplete="off">
<label for="password">Network password</label><input id="password" name="password" required type="password" minlength="8" maxlength="64" autocomplete="new-password">
<label for="server">PC address</label><input id="server" name="server" required value="http://192.168.178.50:8765" inputmode="url"><small>The address of your PC on your own network.</small>
<label for="token">Connection token</label><input id="token" name="token" required type="password" minlength="32" maxlength="127" autocomplete="off"><small>From ~/.config/steamos-utility-center/companion-token on the PC.</small>
<button id="save" type="submit">Save and connect</button></form><p id="result" role="status" aria-live="polite"></p></main>
<script>
const form=document.getElementById('setup'), output=document.getElementById('result'), button=document.getElementById('save');
form.addEventListener('submit',async event=>{event.preventDefault();button.disabled=true;output.textContent='Saving …';try{const data=Object.fromEntries(new FormData(form));data.server=data.server.trim();data.token=data.token.trim();const response=await fetch('/save',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});output.textContent=await response.text();if(!response.ok)button.disabled=false;}catch(error){output.textContent='No answer. Please try again.';button.disabled=false;}});
</script></html>
