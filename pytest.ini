# The checks of this project are all in tests/, and pytest is told so.
#
# Without this it walks the whole tree, and firmware/companion/preview needs
# a clone of LVGL beside it to build. LVGL carries its own checks, one of
# them exits the interpreter while pytest imports it, and the run of this
# project then ends before a single check of ours starts.
[pytest]
testpaths = tests
