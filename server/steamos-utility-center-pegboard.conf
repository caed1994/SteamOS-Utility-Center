# The Nanoleaf Pegboard Desk Dock, for the SteamOS Utility Center.
#
# Written by the Nanoleaf page of the control panel, and read at each start by
# steamos-utility-center-pegboard.service.
#
# The board runs on its own. Nothing that Steam shows on the LED bar reaches
# it, and the settings of the bar are not these settings. The two are separate
# modules and either one works without the other.
#
# To see what this machine has:
#     steamos-utility-center-pegboard --report

# Whether to light the board at all. 0 leaves it dark and the service idle.
ENABLED=1

# The count of LEDs is not here. One Pegboard Desk Dock is 64: two strips of
# 32, one on each side. A board with a different count is a different board,
# and it would need its layout written down and not only its number.

# What to draw: rainbow, rainbow-wave, patrol, fire, aurora, ooze or
# temperature.
#
# They take the 64 LEDs in the order the board has them, up the left side and
# down the right, so an effect travels once around the board.
#
# rainbow-wave is the exception, and the only one with a fold: it is the
# rainbow drawn on half the board and put on both sides, so the colour rises
# on the two sides at once.
#
# The load gauge of the LED bar is not here. It draws two bars of a fixed
# colour that grow with the counters, which reads as a meter on a strip and
# as two coloured stubs on a board.
EFFECT=rainbow

# How bright, from 0 to 255.
BRIGHTNESS=128

# How fast, as a multiple. 2.0 is twice the speed of the effect.
SPEED=1.0

# The curve from the value to the light. 1.0 is no curve.
GAMMA=1.0

# Moves the hue window of the effects that have one, from 0 to 255. It is the
# value that the colour picker of Steam gives the LED bar. The board has no
# Steam, so it is a setting here.
COLOR_SHIFT=0

# The colour of an effect that draws in one. The patrol is the only effect
# that reads it: the rest make their own colours.
COLOR=#ffffff

# The range of the temperature gauge in degrees, and which sensor it reads.
# "auto" takes the first sensor of the CPU that this machine reports.
TEMPERATURE_MIN=40.0
TEMPERATURE_MAX=80.0
TEMPERATURE_SENSOR=auto

# Frames a second for an effect that moves, and for one that does not.
#
# 40 is the most this board takes, and the panel has no slider for it. Above
# that, single LEDs draw with a byte meant for another one: the board answers
# a frame before it draws that frame, so the answer comes every time and the
# LEDs are still wrong. 40 is the last clean rate measured on one, by raising
# it until the flashing came back.
FPS=40
IDLE_FPS=4

# error, warning, info or debug.
LOG_LEVEL=info
